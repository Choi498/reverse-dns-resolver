[project]
name = "reverse-dns-resolver"
version = "0.1.2"
description = "Perform reverse DNS lookups with PTR record resolution and forward-confirmation to detect spoofed PTR entries."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
